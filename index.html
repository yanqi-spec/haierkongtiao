        function renderCustomQa() {
            const qaArray = getCustomQa();

            const filtered = searchTerm ? qaArray.filter(i => i.question.toLowerCase().includes(searchTerm) || i.answer.toLowerCase().includes(searchTerm)) : qaArray;
            if (filtered.length === 0) { qaList.innerHTML = '<div style="color:#7a8fa8; font-size:0.85rem;">暂无匹配话术</div>'; return; }
            let html = '';
            filtered.forEach(item => {
                const idx = qaArray.indexOf(item);

            });
            qaList.innerHTML = html;
            qaList.querySelectorAll('.delete-qa').forEach(btn => btn.addEventListener('click', function() {

        const demandKeywords = { "省电": ["省电","节能","AI省电","超省电","能效","省电率"], "不直吹": ["不直吹","防直吹","风避人","人感控风","AI人感","柔风"], "除菌": ["除菌","除甲醛","净化","离子","母婴","净护","UVC"], "儿童房": ["儿童","母婴","防直吹","柔风","静音","低噪"], "大客厅": ["大3匹","3匹","柜机","大风量","长距离","广角","大挂机"], "静音": ["静音","16分贝","低噪","安静","轻音"], "自清洁": ["自清洁","智清洁","任意洗","56℃","结霜化霜"], "智能控制": ["智能","语音","wifi","离线语音","AI智控","人感","APP"], "性价比": ["统帅","超省电","性价比","风管机","一拖一","实惠"] };
        function parseSearchTerms(q) { if(!q.trim()) return []; return q.replace(/[、，,;；\s]+/g,' ').trim().toLowerCase().split(' ').filter(t=>t); }
        function doesMatchAll(p, terms) { const n=p.name.toLowerCase(), m=p.model.toLowerCase(), f=p.features.toLowerCase(), s=p.sku.toLowerCase(); return terms.every(term => { if(n.includes(term)||m.includes(term)||f.includes(term)||s.includes(term)) return true; for(const [demand,kws] of Object.entries(demandKeywords)){ if(demand.toLowerCase().includes(term)||term.includes(demand.toLowerCase())||kws.some(k=>term.includes(k.toLowerCase()))){ if(kws.some(k=>f.includes(k.toLowerCase())||n.includes(k.toLowerCase()))) return true; } } return false; }); }
        function renderProducts() {
            const terms = parseSearchTerms(currentSearch);
            const filtered = products.filter(p => (currentSeries==='all' || p.series===currentSeries) && (terms.length===0 || doesMatchAll(p,terms)));
            if(!filtered.length) { grid.innerHTML = `<div class="no-result"><i class="fas fa-search" style="font-size:2.5rem;opacity:0.5;"></i><br><br>没有同时满足所有条件的产品</div>`; return; }
            let html=''; filtered.forEach(p=>{ const comm=p.commission||'—'; const link=p.link&&p.link!=='/'?p.link:'#'; const target=link!=='#'?' target="_blank" rel="noopener"':''; const benefits=(p.seed||p.leader||p.cross)?`<div class="benefits-box">${p.seed?`<span class="benefit-item"><i class="fas fa-seedling"></i>种草 ${p.seed}</span>`:''}${p.leader?`<span class="benefit-item"><i class="fas fa-user-check"></i>团长返 ${p.leader}</span>`:''}${p.cross?`<span class="benefit-item"><i class="fas fa-tags"></i>${p.cross}</span>`:''}</div>`:''; const copyText=`${link}\n您点链接右上角点 打开app 跳转到京东app，核实一下是这款吗？`; html+=`<div class="product-card"><div class="card-badge"><span class="series-tag">${p.series}</span><span class="commission">${comm}</span></div><div class="product-name">${p.name}</div><div class="product-model">${p.model}</div><div class="core-features">${p.features}</div>${benefits}<div class="link-sku"><a href="${link}"${target}><i class="fas fa-external-link-alt"></i> 查看</a><button class="copy-btn" data-copy="${encodeURIComponent(copyText)}"><i class="fas fa-copy"></i> 复制</button><span class="sku-code">${p.sku}</span></div></div>`; });
            grid.innerHTML = html;
            grid.querySelectorAll('.copy-btn').forEach(btn=>btn.addEventListener('click',function(){ navigator.clipboard.writeText(decodeURIComponent(this.dataset.copy)).then(()=>{ this.innerHTML='<i class="fas fa-check"></i> 已复制'; this.classList.add('copied'); setTimeout(()=>{ this.innerHTML='<i class="fas fa-copy"></i> 复制'; this.classList.remove('copied'); },1500); }); }));
        }
        seriesTabs.addEventListener('click', e=>{ const tab=e.target.closest('span'); if(!tab) return; currentSeries=tab.dataset.series; seriesTabs.querySelectorAll('span').forEach(t=>t.classList.toggle('active', t.dataset.series===currentSeries)); renderProducts(); });
        searchInput.addEventListener('input', ()=>{ currentSearch=searchInput.value; renderProducts(); });
        clearBtn.addEventListener('click', ()=>{ searchInput.value=''; currentSearch=''; renderProducts(); });
        demandTags.addEventListener('click', e=>{ const tag=e.target.closest('.tag'); if(tag){ searchInput.value=tag.dataset.demand; currentSearch=tag.dataset.demand; renderProducts(); } });

        // ================= 事件绑定 =================
        addQaBtn.addEventListener('click', addCustomQa);
        exportBtn.addEventListener('click', exportCustomQa);
        importBtn.addEventListener('click', ()=>importFile.click());
        importFile.addEventListener('change', e=>{ if(e.target.files[0]) importCustomQa(e.target.files[0]); e.target.value=''; });
        qaSearchInput.addEventListener('input', renderCustomQa);

        // ================= 初始化 =================
        if (localStorage.getItem('haier_sidebar_collapsed') === '1') {
            sidebar.classList.add('collapsed');
            toggleSidebar.innerHTML = '<i class="fas fa-chevron-right"></i> 展开';
        }
        renderProducts();
        renderCustomQa();
    })();
</script>
</body>
</html>
