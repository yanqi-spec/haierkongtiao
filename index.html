        imageUploadBtn.addEventListener('click', () => imageFileInput.click());
        imageFileInput.addEventListener('change', (e) => {

            const reader = new FileReader();
            reader.onload = (ev) => {
                pendingImageData = ev.target.result;
                imagePreview.src = pendingImageData;

            };
            reader.readAsDataURL(file);
            e.target.value = '';
        });
        removeImageBtn.addEventListener('click', () => {
            pendingImageData = null;
            imagePreview.src = '';
            imagePreview.style.display = 'none';
            removeImageBtn.style.display = 'none';
        });

        const STORAGE_KEY = 'haier_custom_qa_image_v2';
        function getCustomQa() {
            try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; }

        function setCustomQa(qaArray) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(qaArray));
            renderCustomQa();
        }
        function renderCustomQa() {
            const qaArray = getCustomQa();
            const searchTerm = qaSearchInput.value.trim().toLowerCase();
            const filtered = searchTerm ? qaArray.filter(item => 
                item.question.toLowerCase().includes(searchTerm) || item.answer.toLowerCase().includes(searchTerm)
            ) : qaArray;
            if (filtered.length === 0) {
                qaList.innerHTML = '<div style="color:#7a8fa8; font-size:0.85rem;">暂无匹配话术</div>';
                return;
            }
            let html = '';
            filtered.forEach((item, index) => {
                // 使用原始索引用于删除操作（在原始数组中）
                const originalIndex = qaArray.indexOf(item);
                const imageHtml = item.image ? `<img src="${item.image}" class="qa-image" data-index="${originalIndex}" alt="话术图片">` : '';
                html += `
                    <div class="qa-item">
                        <div class="qa-content">
                            <div class="qa-question"><i class="fas fa-question-circle" style="color:#0077ee; margin-right:6px;"></i>${item.question}</div>
                            <div class="qa-answer"><i class="fas fa-reply" style="color:#00875a; margin-right:6px;"></i>${item.answer}</div>
                            ${imageHtml}
                        </div>
                        <div class="qa-actions">
                            <button class="delete-qa" data-index="${originalIndex}" title="删除"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    </div>
                `;
            });
            qaList.innerHTML = html;
            qaList.querySelectorAll('.delete-qa').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    const qaArray = getCustomQa();
                    qaArray.splice(idx, 1);
                    setCustomQa(qaArray);
                });
            });
            qaList.querySelectorAll('.qa-image').forEach(img => {
                img.addEventListener('click', function() {
                    // 修复图片打不开：在新窗口打开图片
                    window.open(this.src, '_blank');
                });
            });
        }
        function addCustomQa() {
            const question = newQuestion.value.trim();
            const answer = newAnswer.value.trim();
            if (!question || !answer) { alert('请同时填写问题和回复话术'); return; }
            const qaArray = getCustomQa();
            const newItem = { question, answer };
            if (pendingImageData) {
                newItem.image = pendingImageData;
            }
            qaArray.push(newItem);
            setCustomQa(qaArray);
            newQuestion.value = '';
            newAnswer.value = '';
            pendingImageData = null;
            imagePreview.src = '';
            imagePreview.style.display = 'none';
            removeImageBtn.style.display = 'none';
        }
        function exportCustomQa() {
            const qaArray = getCustomQa();
            if (!qaArray.length) { alert('暂无可导出的自定义话术'); return; }
            const blob = new Blob([JSON.stringify(qaArray, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `海尔话术_${new Date().toISOString().slice(0,10)}.json`;
            a.click(); URL.revokeObjectURL(url);
        }
        function importCustomQa(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!Array.isArray(data)) throw new Error();
                    setCustomQa([...getCustomQa(), ...data]);
                    alert(`成功导入 ${data.length} 条话术`);
                } catch { alert('导入失败：文件格式错误'); }
            };
            reader.readAsText(file);
        }

        const demandKeywords = {
            "省电": ["省电", "节能", "AI省电", "超省电", "能效", "省电率"],
            "不直吹": ["不直吹", "防直吹", "风避人", "人感控风", "AI人感", "柔风"],
            "除菌": ["除菌", "除甲醛", "净化", "离子", "母婴", "净护", "UVC"],
            "儿童房": ["儿童", "母婴", "防直吹", "柔风", "静音", "低噪"],
            "大客厅": ["大3匹", "3匹", "柜机", "大风量", "长距离", "广角", "大挂机"],
            "静音": ["静音", "16分贝", "低噪", "安静", "轻音"],
            "自清洁": ["自清洁", "智清洁", "任意洗", "56℃", "结霜化霜"],
            "智能控制": ["智能", "语音", "wifi", "离线语音", "AI智控", "人感", "APP"],
            "性价比": ["统帅", "超省电", "性价比", "风管机", "一拖一", "实惠"]
        };
        function parseSearchTerms(query) {
            if (!query.trim()) return [];
            return query.replace(/[、，,;；\s]+/g, ' ').trim().toLowerCase().split(' ').filter(t => t);
        }
        function doesMatchAll(p, terms) {
            const name = p.name.toLowerCase(), model = p.model.toLowerCase(), feat = p.features.toLowerCase(), sku = p.sku.toLowerCase();
            return terms.every(term => {
                if (name.includes(term) || model.includes(term) || feat.includes(term) || sku.includes(term)) return true;
                for (const [demand, kws] of Object.entries(demandKeywords)) {
                    if (demand.toLowerCase().includes(term) || term.includes(demand.toLowerCase()) || kws.some(k => term.includes(k.toLowerCase()))) {
                        if (kws.some(k => feat.includes(k.toLowerCase()) || name.includes(k.toLowerCase()))) return true;
                    }
                }
                return false;
            });
        }
        function renderProducts() {
            const terms = parseSearchTerms(currentSearch);
            const filtered = products.filter(p => (currentSeries === 'all' || p.series === currentSeries) && (terms.length === 0 || doesMatchAll(p, terms)));
            if (!filtered.length) {
                grid.innerHTML = `<div class="no-result"><i class="fas fa-search" style="font-size:2.5rem;opacity:0.5;"></i><br><br>没有同时满足所有条件的产品</div>`;
                return;
            }
            let html = '';
            filtered.forEach(p => {
                const comm = p.commission || '—';
                const link = p.link && p.link !== '/' ? p.link : '#';
                const target = link !== '#' ? ' target="_blank" rel="noopener"' : '';
                const benefits = (p.seed || p.leader || p.cross) ? `<div class="benefits-box">${p.seed?`<span class="benefit-item"><i class="fas fa-seedling"></i>种草 ${p.seed}</span>`:''}${p.leader?`<span class="benefit-item"><i class="fas fa-user-check"></i>团长返 ${p.leader}</span>`:''}${p.cross?`<span class="benefit-item"><i class="fas fa-tags"></i>${p.cross}</span>`:''}</div>` : '';
                const copyText = `${link}\n您点链接右上角点 打开app 跳转到京东app，核实一下是这款吗？`;
                html += `<div class="product-card"><div class="card-badge"><span class="series-tag">${p.series}</span><span class="commission">${comm}</span></div><div class="product-name">${p.name}</div><div class="product-model">${p.model}</div><div class="core-features">${p.features}</div>${benefits}<div class="link-sku"><a href="${link}"${target}><i class="fas fa-external-link-alt"></i> 查看</a><button class="copy-btn" data-copy="${encodeURIComponent(copyText)}"><i class="fas fa-copy"></i> 复制</button><span class="sku-code">${p.sku}</span></div></div>`;
            });
            grid.innerHTML = html;
            grid.querySelectorAll('.copy-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    navigator.clipboard.writeText(decodeURIComponent(this.dataset.copy)).then(() => {
                        this.innerHTML = '<i class="fas fa-check"></i> 已复制'; this.classList.add('copied');
                        setTimeout(() => { this.innerHTML = '<i class="fas fa-copy"></i> 复制'; this.classList.remove('copied'); }, 1500);
                    });
                });
            });
        }
        seriesTabs.addEventListener('click', e => {
            const tab = e.target.closest('span'); if (!tab) return;
            currentSeries = tab.dataset.series; updateTabs(); renderProducts();
        });
        function updateTabs() { seriesTabs.querySelectorAll('span').forEach(t => t.classList.toggle('active', t.dataset.series === currentSeries)); }
        searchInput.addEventListener('input', () => { currentSearch = searchInput.value; renderProducts(); });
        clearBtn.addEventListener('click', () => { searchInput.value=''; currentSearch=''; renderProducts(); });
        demandTags.addEventListener('click', e => { const tag = e.target.closest('.tag'); if(tag){ searchInput.value=tag.dataset.demand; currentSearch=tag.dataset.demand; renderProducts(); } });

        addQaBtn.addEventListener('click', addCustomQa);
        exportBtn.addEventListener('click', exportCustomQa);
        importBtn.addEventListener('click', () => importFile.click());
        importFile.addEventListener('change', (e) => { if(e.target.files[0]) importCustomQa(e.target.files[0]); e.target.value=''; });
        qaSearchInput.addEventListener('input', renderCustomQa);

        renderProducts();
        renderCustomQa();
    })();
</script>
</body>
</html>
