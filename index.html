            { series: "统帅", name: "统帅超省电Air", model: "KFR-72LW/LTA1-1", features: "双排纯铜管，一键超省电", link: "https://u.jd.com/k6nyele", sku: "100310724832", commission: "1.10%", seed: "", leader: "", cross: "" }
        ];

        const grid = document.getElementById('productGrid');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearSearchBtn');
        const seriesTabs = document.getElementById('seriesTabs');
        const demandTags = document.getElementById('demandTags');
        let currentSeries = 'all';
        let currentSearch = '';

        const demandKeywords = {
            "省电": ["省电", "节能", "AI省电", "超省电", "能效", "省电率"],
            "不直吹": ["不直吹", "防直吹", "风避人", "人感控风", "AI人感", "柔风"],
            "除菌": ["除菌", "除甲醛", "净化", "离子", "母婴", "净护", "UVC"],
            "儿童房": ["儿童", "母婴", "防直吹", "柔风", "静音", "低噪"],
            "大客厅": ["大3匹", "3匹", "柜机", "大风量", "长距离", "广角", "大挂机"],
            "静音": ["静音", "16分贝", "低噪", "安静", "轻音"],
            "自清洁": ["自清洁", "智清洁", "任意洗", "56℃", "结霜化霜"],
            "智能控制": ["智能", "语音", "wifi", "离线语音", "AI智控", "人感", "APP"],
            "性价比": ["统帅", "超省电", "性价比", "风管机", "一拖一", "实惠"]
        };

        function parseSearchTerms(query) {
            if (!query.trim()) return [];
            return query.replace(/[、，,;；\s]+/g, ' ').trim().toLowerCase().split(' ').filter(term => term.length > 0);
        }

        // 复制话术格式：链接 + 固定话术
        function generateCopyText(p) {
            const link = p.link && p.link !== '/' ? p.link : '暂无链接';
            return `${link}\n您点链接右上角点 打开app 跳转到京东app，核实一下是这款吗？`;
        }

        function render() {
            const terms = parseSearchTerms(currentSearch);
            const filtered = products.filter(p => {
                if (currentSeries !== 'all' && p.series !== currentSeries) return false;
                if (terms.length === 0) return true;
                const nameLower = p.name.toLowerCase();
                const modelLower = p.model.toLowerCase();
                const featuresLower = p.features.toLowerCase();
                const skuLower = p.sku.toLowerCase();
                return terms.every(term => {
                    const directMatch = nameLower.includes(term) || modelLower.includes(term) || featuresLower.includes(term) || skuLower.includes(term);
                    if (directMatch) return true;
                    for (const [demand, keywords] of Object.entries(demandKeywords)) {
                        if (demand.toLowerCase().includes(term) || term.includes(demand.toLowerCase()) || keywords.some(k => term.includes(k.toLowerCase()))) {
                            const matchedKeywords = keywords.some(k => featuresLower.includes(k.toLowerCase()) || nameLower.includes(k.toLowerCase()));
                            if (matchedKeywords) return true;
                        }
                    }
                    return false;
                });
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="no-result"><i class="fas fa-search" style="font-size:2.5rem;opacity:0.5;"></i><br><br>没有匹配的产品，试试减少需求或更换关键词</div>`;
                return;
            }

            let html = '';
            filtered.forEach((p) => {
                const comm = p.commission ? p.commission : '—';
                const link = p.link && p.link !== '/' ? p.link : '#';
                const linkTarget = link !== '#' ? ' target="_blank" rel="noopener"' : '';
                const seed = p.seed || '';
                const leader = p.leader || '';
                const cross = p.cross || '';
                let benefitsHtml = '';
                if (seed || leader || cross) {
                    benefitsHtml = `<div class="benefits-box">`;
                    if (seed) benefitsHtml += `<span class="benefit-item"><i class="fas fa-seedling"></i> 种草 ${seed}</span>`;
                    if (leader) benefitsHtml += `<span class="benefit-item"><i class="fas fa-user-check"></i> 团长返 ${leader}</span>`;
                    if (cross) benefitsHtml += `<span class="benefit-item"><i class="fas fa-tags"></i> ${cross}</span>`;
                    benefitsHtml += `</div>`;
                }
                const copyText = generateCopyText(p);
                html += `
                    <div class="product-card">
                        <div class="card-badge">
                            <span class="series-tag"><i class="fas fa-tag"></i> ${p.series}</span>
                            <span class="commission"><i class="fas fa-percent"></i> ${comm}</span>
                        </div>
                        <div class="product-name">${p.name}</div>
                        <div class="product-model">${p.model}</div>
                        <div class="core-features"><i class="fas fa-bolt"></i> ${p.features}</div>
                        ${benefitsHtml}
                        <div class="link-sku">
                            <a href="${link}"${linkTarget}><i class="fas fa-external-link-alt"></i> 查看链接</a>
                            <button class="copy-btn" data-copy-text="${encodeURIComponent(copyText)}"><i class="fas fa-copy"></i> 复制话术</button>
                            <span class="sku-code"><i class="fas fa-hashtag"></i> ${p.sku}</span>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;

            // 绑定复制按钮事件
            document.querySelectorAll('.copy-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const copyText = decodeURIComponent(this.dataset.copyText);
                    navigator.clipboard.writeText(copyText).then(() => {
                        const originalHtml = this.innerHTML;
                        this.innerHTML = '<i class="fas fa-check"></i> 已复制';
                        this.classList.add('copied');
                        setTimeout(() => {
                            this.innerHTML = originalHtml;
                            this.classList.remove('copied');
                        }, 1500);
                    }).catch(() => {
                        alert('复制失败，请手动复制：\n' + copyText);
                    });
                });
            });
        }

        function updateTabs(series) {
            seriesTabs.querySelectorAll('span').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.series === series);
            });
        }

        seriesTabs.addEventListener('click', (e) => {
            const tab = e.target.closest('span');
            if (!tab) return;
            currentSeries = tab.dataset.series;
            updateTabs(currentSeries);
            render();
        });

        searchInput.addEventListener('input', (e) => { currentSearch = e.target.value; render(); });
        clearBtn.addEventListener('click', () => { searchInput.value = ''; currentSearch = ''; render(); });
        demandTags.addEventListener('click', (e) => {
            const tag = e.target.closest('.tag');
            if (!tag) return;
            searchInput.value = tag.dataset.demand;
            currentSearch = tag.dataset.demand;
            render();
            searchInput.focus();
        });

        render();
    })();
</script>
